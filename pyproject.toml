[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleoperator-mcp"
version = "0.1.0"
description = "WebXR teleoperation gateway — VR pose streaming to fleet robots via MCP + WebSocket"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal", email = "sandraschipal@gmail.com" }]
keywords = ["mcp", "webxr", "teleoperation", "robotics", "pico", "fastmcp", "livekit"]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "prefab-ui>=0.14.0",
    "websockets>=13.0",
    "livekit>=1.0.0",
    "livekit-api>=1.0.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0,<0.17",
    "pre-commit>=4.0.0",
]

[project.scripts]
teleoperator-mcp = "teleoperator_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sandraschi/teleoperator-mcp"
Source = "https://github.com/sandraschi/teleoperator-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/teleoperator_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
